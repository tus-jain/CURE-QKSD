      .sub { font-family: "STIX Two Math", "Times New Roman", serif; font-size: 21px; font-style: normal; fill: #17364f; }
      .roman-sub { font-family: "STIX Two Text", "Times New Roman", serif; font-size: 19px; fill: #17364f; }
      .panel { fill: url(#panel-grid); stroke: #1d5d91; stroke-width: 3.2; }
      .primary-stroke { stroke: #1d5d91; }
      .primary-fill { fill: #1d5d91; }
      .secondary-stroke { stroke: #78a9cf; }
      .secondary-fill { fill: #78a9cf; }
      .round { stroke-linecap: round; stroke-linejoin: round; }
    </style>

