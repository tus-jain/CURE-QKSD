  <text class="serif body" x="396" y="418" text-anchor="middle">autocorrelations <tspan font-family="STIX Two Math, Times New Roman, serif" font-style="normal">c(nτ)</tspan></text>

  <text class="serif title" x="1130" y="91" text-anchor="middle">large-τ UQKSD</text>
