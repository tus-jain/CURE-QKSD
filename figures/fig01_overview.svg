        font-kerning: normal;
        font-variant-ligatures: common-ligatures;
        letter-spacing: normal;
        word-spacing: normal;
        text-rendering: optimizeLegibility;
      }
      .serif { font-family: "STIX Two Text", "Times New Roman", serif; fill: #17364f; }
      .math { font-family: "STIX Two Math", "Times New Roman", serif; font-style: normal; fill: #17364f; }
