  <text class="serif" x="1307.5" y="154" text-anchor="middle" font-size="23" font-weight="700" fill="#1d5d91">extracted</text>
  <text class="serif" x="1307.5" y="184" text-anchor="middle" font-size="23" font-weight="700" fill="#1d5d91">wrapped</text>
  <text class="serif" x="1307.5" y="214" text-anchor="middle" font-size="23" font-weight="700" fill="#1d5d91">phase</text>
  <text class="math" x="1130" y="392" text-anchor="middle" font-size="26">7π/3 → π/3 (mod 2π)</text>
  <text class="serif" x="1130" y="426" text-anchor="middle" font-size="22" fill="#4f7695">7π/3 ≡ π/3 ≡ −5π/3</text>

  <text class="serif" x="250" y="630" text-anchor="middle" font-size="30" font-weight="700">unknown integer <tspan font-style="normal">k</tspan></text>
  <g aria-label="E equals E sub aliased plus 2 pi k over tau">
    <text class="math" x="110" y="682" font-size="31">E = E</text>
    <text class="roman-sub" x="183" y="694">aliased</text>
    <text class="math" x="255" y="682" font-size="31">+ 2πk/τ</text>
  </g>
