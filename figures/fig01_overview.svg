    <text x="285" y="879">k = 0</text><text x="285" y="949">k = −1</text>
  </g>
  <text class="serif" x="390" y="814" text-anchor="middle" font-size="56" font-weight="700" fill="#1d5d91" aria-label="unknown winding">?</text>

  <text class="serif title" x="770" y="570" text-anchor="middle" fill="#1d5d91">CURE-QKSD</text>
  <text class="serif subtitle" x="770" y="607" text-anchor="middle">align candidate energies</text>

