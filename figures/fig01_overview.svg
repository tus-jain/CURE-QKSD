<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc" style="background:#ffffff">
  <title id="title">CURE-QKSD phase-unwrapping workflow</title>
  <desc id="desc">A five-step diagram showing a continuous quantum autocorrelation signal sampled at discrete time steps, extraction of a wrapped phase, loss of the integer k, identification of k using two time-step energy ladders, and recovery of the correct energy.</desc>

