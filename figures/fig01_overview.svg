  <rect x="687" y="753" width="126" height="34" rx="10" fill="#ffffff" stroke="#c8ddeb" stroke-width="1.5"/>
  <text class="serif" x="750" y="777" text-anchor="middle" font-size="20" font-weight="700" fill="#1d5d91">same energy</text>
  </g>

  <text class="serif title" x="1260" y="630" text-anchor="middle">correct energy</text>
  <g aria-label="E equals E sub aliased plus 2 pi times 1 over tau">
    <text class="math" x="1110" y="682" font-size="31">E = E</text>
    <text class="roman-sub" x="1187" y="694">aliased</text>
    <text class="math" x="1260" y="682" font-size="31">+ 2π(1)/τ</text>
  </g>
